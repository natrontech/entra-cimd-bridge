version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprint
    gosec:
      excludes:
        # Unchecked errors are errcheck's job, which knows that closing a body can be ignored
        - G104
  exclusions:
    rules:
      # The fake IdP and its browser only ever run in tests
      - path: internal/testenv/
        linters:
          - gosec
formatters:
  enable:
    - gofmt
