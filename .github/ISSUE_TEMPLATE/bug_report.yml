name: Bug report
title: "Bug: "
description: Report something that is not working as expected
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out our bug report form

  - type: textarea
    id: steps-to-reproduce
    validations:
      required: true
    attributes:
      label: "Reproduction steps"
      description: "How do you trigger this bug? Please walk us through it step by step."
      placeholder: "When I ..."

  - type: textarea
    id: expected-behavior
    validations:
      required: true
    attributes:
      label: "Expected behavior"
      description: "What did you think would happen?"
      placeholder: "It should ..."

  - type: textarea
    id: actual-behavior
    validations:
      required: true
    attributes:
      label: "Actual Behavior"
      description: "What did actually happen? Add screenshots, if applicable."
      placeholder: "It actually ..."

  - type: markdown
    attributes:
      value: |
        ### Additional Information

  - type: input
    id: client
    validations:
      required: false
    attributes:
      label: "MCP client and IdP"
      description: "The MCP client and the IdP the bridge sits in front of."
      placeholder: "e.g., Claude Code with Entra ID"

  - type: textarea
    id: log-files
    validations:
      required: false
    attributes:
      label: "Log Output"
      description: "The bridge's logs when the issue occurred. Remove any tokens, codes or secrets first."
      render: shell

  - type: markdown
    attributes:
      value: |
        **Before submitting, please check if the issue hasn't been raised before.**
