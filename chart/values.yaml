# Several replicas share nothing but the signing keys, so the bridge scales freely
replicaCount: 2

image:
  repository: harbor.natron.services/natron-public/entra-cimd-bridge
  # Defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The bridge's configuration as in config.example.yaml, without listen and metrics_listen, which the chart sets
# ${NAME} references are filled from the container's environment, so secrets stay in existingSecret
config:
  issuer: https://mcp-auth.example.com
  signing_keys:
    - ${BRIDGE_KEY_CURRENT}
  providers:
    entra:
      issuer: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
  clients:
    cimd_hosts: [claude.ai, chatgpt.com, vscode.dev]
  consent_ttl: 720h
  resources: []
  #  - uri: https://contactr.example.com/mcp
  #    name: Contactr
  #    provider: entra
  #    client_id: 11111111-1111-1111-1111-111111111111
  #    client_secret: ${CONTACTR_CLIENT_SECRET}
  #    scopes: [api://11111111-1111-1111-1111-111111111111/access_as_user, offline_access]

# A Secret whose keys become environment variables, such as BRIDGE_KEY_CURRENT and the client secrets
existingSecret: ""

# More environment variables for the container
env: []

logLevel: info

service:
  type: ClusterIP
  port: 80

# The ingress only ever routes to the OAuth port, never to /metrics
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: mcp-auth.example.com
  tls: []
  #  - secretName: mcp-auth-tls
  #    hosts: [mcp-auth.example.com]

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
