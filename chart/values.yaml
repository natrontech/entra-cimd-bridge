# Several replicas share nothing but the signing keys, so the bridge scales freely
replicaCount: 2

image:
  repository: ghcr.io/natrontech/entra-cimd-bridge
  # Defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The bridge's configuration as in config.example.yaml, without listen and metrics_listen, which the chart sets
# ${NAME} references are filled from the container's environment, so secrets stay in existingSecret
config:
  issuer: https://mcp-auth.example.com
  signing_keys:
    - ${BRIDGE_KEY_CURRENT}
  providers:
    entra:
      issuer: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
      # Helm merges this map into yours, so the token the chart mounts (see federatedToken) is only suggested here
      # federated_token_file: /var/run/secrets/azure/tokens/azure-identity-token
  clients:
    cimd_hosts: [claude.ai, chatgpt.com, vscode.dev]
  consent_ttl: 720h
  resources: []
  #  - uri: https://contactr.example.com/mcp
  #    name: Contactr
  #    provider: entra
  #    client_id: 11111111-1111-1111-1111-111111111111
  #    client_secret: ${CONTACTR_CLIENT_SECRET} # only without federated_token_file
  #    scopes: [api://11111111-1111-1111-1111-111111111111/access_as_user, offline_access]

# A Secret whose keys become environment variables, such as BRIDGE_KEY_CURRENT and client secrets if a provider has no federated_token_file
existingSecret: ""

# The pod's service-account token is mounted at /var/run/secrets/azure/tokens/azure-identity-token for providers.<name>.federated_token_file
# Each app registration trusts it through a federated identity credential with the subject system:serviceaccount:<namespace>:<name>, where the chart names the ServiceAccount like the Deployment
federatedToken:
  audience: api://AzureADTokenExchange

# More environment variables for the container
env: []

logLevel: info

service:
  type: ClusterIP
  port: 80

# The ingress only ever routes to the OAuth port, never to /metrics
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: mcp-auth.example.com
  tls: []
  #  - secretName: mcp-auth-tls
  #    hosts: [mcp-auth.example.com]

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
